name: Python Package

# macOS is GitHub-hosted, slow and expensive: its wheels are built only on a
# python-v* release tag or when requested with include_macos. Pull requests and
# pushes to main build Linux and Windows only.
#
# Linux and Windows jobs run on CLB's self-hosted Slurm runners (clb-ci-linux,
# clb-ci-windows). Pull requests from forks always fall back to GitHub-hosted
# runners, so they never reach a self-hosted runner. The Linux wheels stay
# GitHub-hosted: maturin-action builds them in a manylinux_2_28 Docker
# container, and the self-hosted Linux runner has no Docker. publish-pypi stays
# GitHub-hosted (trusted publishing through a Docker action).
on:
  pull_request:
    paths:
      - ".github/workflows/python-package.yml"
      - "python/**"
      - "src/rust/freestiler-core/**"
  push:
    branches:
      - main
    tags:
      - "python-v*"
    paths:
      - ".github/workflows/python-package.yml"
      - "python/**"
      - "src/rust/freestiler-core/**"
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build the macOS wheels"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-native-input:
    name: Native input regressions
    # Fork pull requests -> GitHub-hosted; otherwise the self-hosted Linux runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64", "clb-ci-linux"]') }}
    env:
      DUCKDB_EXPLICIT_PLATFORM: linux_amd64
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The self-hosted image has no Rust: the action installs rustup under HOME.
      - name: Cargo on PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      # fastpfor's build script needs CMake, which the self-hosted image lacks
      # and cannot apt-install (no root); uv installs the PyPI build under HOME.
      - name: CMake
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then
            uv tool install cmake
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Test temporal properties and CRS-tagged geometry
        run: cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --features geoparquet,duckdb --test native_input
      - name: Test tile gzip levels
        run: cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test gzip_level
      - name: Test layered multi-layer tiling against the in-memory engine
        run: cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test layered
      - name: Test the tile buffer, collapsed-line fallback and keep_short_lines
        run: |
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test buffer
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test line_collapse
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test short_lines
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --lib -- short_lines::
      - name: Test per-zoom polygon simplification
        run: |
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test polygon_zoom
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --lib -- polygon_zoom::
      - name: Test tile deduplication, sorted values and per-zoom line simplification
        run: |
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --test compact
          cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --lib -- line_zoom:: pmtiles_writer::
      - name: Test Arrow input and pure-Rust reprojection
        run: "cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --features arrow --lib -- crs:: arrow_input:: mvt::"

  build-wheels:
    name: Build Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    # Linux wheels: GitHub-hosted (maturin-action manylinux Docker, see top).
    # Windows wheels are the build-wheels-windows job below.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-24.04: ubuntu-latest now resolves to Ubuntu 26.04,
          # where actions/setup-python has no Python 3.9. The wheels are built
          # inside the manylinux container, so the host version does not matter.
          - os: ubuntu-24.04
            python-version: "3.9"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp39-cp39/bin/python"
          - os: ubuntu-24.04
            python-version: "3.10"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp310-cp310/bin/python"
          - os: ubuntu-24.04
            python-version: "3.11"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp311-cp311/bin/python"
          - os: ubuntu-24.04
            python-version: "3.12"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp312-cp312/bin/python"
          - os: ubuntu-24.04
            python-version: "3.13"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp313-cp313/bin/python"
          - os: ubuntu-24.04
            python-version: "3.14"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp314-cp314/bin/python"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        env:
          DUCKDB_EXPLICIT_PLATFORM: ${{ matrix.duckdb_explicit_platform }}
        with:
          command: build
          args: --manifest-path python/Cargo.toml --release --out dist -i ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  # Windows wheels run on the self-hosted Windows runner: one VM shared by every CLB
  # repository, one job at a time. Pull requests and pushes to main build one Python
  # version; python-v* release tags and manual runs build all six (PE decision 2026-11-09).
  build-wheels-windows:
    name: Build Wheel (windows-2022, py${{ matrix.python-version }})
    # Fork pull requests -> GitHub-hosted windows-2022; otherwise the self-hosted runner,
    # which has VS 2022 Build Tools. GitHub-hosted is pinned to windows-2022 (VS 2022):
    # windows-latest and windows-2025 resolve to the VS 2026 image, whose MSVC removed
    # stdext::checked_array_iterator and breaks the bundled DuckDB build (vendored fmt).
    # Revisit once duckdb-rs supports VS 2026.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["windows-2022"]' || '["self-hosted", "Windows", "X64", "clb-ci-windows"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((startsWith(github.ref, 'refs/tags/python-v') || github.event_name == 'workflow_dispatch') && '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The self-hosted Windows image has rustup on PATH but may lack the cargo
      # proxies (CARGO_HOME=C:\rust\cargo): put the selected toolchain's cargo
      # directory on PATH.
      - uses: dtolnay/rust-toolchain@stable
      - name: Put the toolchain's cargo on PATH
        shell: bash
        run: |
          cargo_exe="$(rustup which cargo)"
          cargo_exe="${cargo_exe//\\//}"
          echo "${cargo_exe%/*}" >> "$GITHUB_PATH"
      # pip's maturin rather than maturin-action, which fails on the self-hosted
      # Windows image (it unpacks its download with Windows PowerShell 5.1:
      # Expand-Archive NotSupportedArchiveFileExtension, run 42719164714). The
      # action installs the latest maturin, as pip does here; same arguments.
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade maturin
          python -m maturin build --manifest-path python/Cargo.toml --release --out dist -i python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-2022-py${{ matrix.python-version }}
          path: dist/*

  # Release tags and manual opt-in only (see the note at the top of this file).
  build-wheels-macos:
    name: Build Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    if: startsWith(github.ref, 'refs/tags/python-v') || inputs.include_macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path python/Cargo.toml --release --out dist -i python
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  build-sdist:
    name: Build sdist
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64", "clb-ci-linux"]') }}
    steps:
      - uses: actions/checkout@v4
      # maturin sdist runs cargo metadata; the self-hosted Linux image has no Rust.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo on PATH
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [test-native-input, build-wheels, build-wheels-windows, build-wheels-macos, build-sdist]
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/freestiler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
